name: Build tested SEO image

on:
  push:
    branches: [seo/sitelinks-20261013]
    paths: [.github/workflows/seo-image-build.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1aa4c43cc04e3667af82451ee2ce42a82f9fd1a0
          persist-credentials: false
      - name: Check public VPS connectivity
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import socket, urllib.request
          for url in ("https://lebonrebond.fr/api/health", "https://caraaios.com/robots.txt"):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      print(url, r.status, r.read(300).decode("utf-8", errors="replace"))
              except Exception as e:
                  print(url, type(e).__name__, str(e))
          try:
              with socket.create_connection(("204.168.138.243", 22), timeout=10) as s:
                  s.settimeout(10)
                  print("SSH banner:", s.recv(200).decode("ascii", errors="replace"))
          except Exception as e:
              print("SSH:", type(e).__name__, str(e))
          PY
      - name: Build exact tested source
        run: docker build -t rebondpro-app:1aa4c43 .
      - name: Export deployable image
        run: |
          docker save rebondpro-app:1aa4c43 | gzip -1 > rebondpro-app-1aa4c43.tar.gz
          sha256sum rebondpro-app-1aa4c43.tar.gz > rebondpro-app-1aa4c43.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rebondpro-seo-image-1aa4c43
          path: |
            rebondpro-app-1aa4c43.tar.gz
            rebondpro-app-1aa4c43.sha256
          compression-level: 0
          retention-days: 3

