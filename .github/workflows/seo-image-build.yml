name: Build tested SEO image

on:
  push:
    branches: [seo/sitelinks-20261013]
    paths: [.github/workflows/seo-image-build.yml, 'src/**']
  workflow_dispatch:
    inputs:
      performance_audit:
        description: Compare the homepage against the published SEO baseline, on this runner only
        type: boolean
        default: false
      seo_audit:
        description: Validate public SEO and sitemap XML on this runner without a real database
        type: boolean
        default: false
      node_base_digest:
        description: Optional verified Node base digest (sha256 plus 64 lowercase hex characters); empty uses the current tag
        type: string
        default: ''

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select optional reproducible Node base
        env:
          REQUESTED_NODE_BASE_DIGEST: ${{ inputs.node_base_digest }}
        run: |
          if [[ -n "$REQUESTED_NODE_BASE_DIGEST" ]]; then
            if [[ ${#REQUESTED_NODE_BASE_DIGEST} -ne 71 || ! "$REQUESTED_NODE_BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid node_base_digest: expected sha256: followed by 64 lowercase hex characters" >&2
              exit 1
            fi
            node_base_image="node:22-bookworm-slim@$REQUESTED_NODE_BASE_DIGEST"
          else
            node_base_image="node:22-bookworm-slim"
          fi
          printf 'NODE_BASE_IMAGE=%s\n' "$node_base_image" >> "$GITHUB_ENV"
          printf 'NODE_BASE_DIGEST_INPUT=%s\n' "$REQUESTED_NODE_BASE_DIGEST" >> "$GITHUB_ENV"
          echo "Selected Node base: $node_base_image"
      - name: Check public VPS connectivity
        if: ${{ !inputs.performance_audit && !inputs.seo_audit }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import socket, urllib.request
          for url in ("https://lebonrebond.fr/api/health", "https://caraaios.com/robots.txt"):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      print(url, r.status, r.read(300).decode("utf-8", errors="replace"))
              except Exception as e:
                  print(url, type(e).__name__, str(e))
          try:
              with socket.create_connection(("204.168.138.243", 22), timeout=10) as s:
                  s.settimeout(10)
                  print("SSH banner:", s.recv(200).decode("ascii", errors="replace"))
          except Exception as e:
              print("SSH:", type(e).__name__, str(e))
          PY
      - name: Build exact tested source
        run: docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" -t rebondpro-app:${GITHUB_SHA} .
      - name: Validate candidate without a real database
        if: inputs.performance_audit || inputs.seo_audit
        run: |
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" --target builder -t rebondpro-builder:${GITHUB_SHA} .
          docker run --rm rebondpro-builder:${GITHUB_SHA} sh -c "npx tsc --noEmit --incremental false && npx eslint 'src/app/(site)/page.tsx' src/app/sitemap.ts src/lib/sitemap-lastmod.ts scripts/smoke-public-seo.ts scripts/audit-home-performance.mjs && npm run smoke:public-seo"
      - name: Validate public sitemap XML on the isolated runner
        if: inputs.seo_audit
        run: |
          mkdir -p "$RUNNER_TEMP/rebond-seo-validation"
          docker run -d --name rebond-seo-candidate -p 3763:3000 -e DATABASE_URL=postgresql://unavailable:unavailable@127.0.0.1:1/unavailable -e AUTH_SECRET=isolated-ci-placeholder -e APP_PUBLIC_URL=https://lebonrebond.fr rebondpro-app:${GITHUB_SHA}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3763/ > /dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host rebondpro-builder:${GITHUB_SHA} npm run smoke:public-seo -- --base-url http://127.0.0.1:3763
          curl -fsS http://127.0.0.1:3763/sitemap.xml > "$RUNNER_TEMP/rebond-seo-validation/sitemap.xml"
          python3 - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'rebond-seo-validation'
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          entries = [{'url': item.findtext('s:loc', namespaces=ns), 'lastmod': item.findtext('s:lastmod', namespaces=ns)} for item in ET.parse(output / 'sitemap.xml').getroot()]
          assert len(entries) == 21 and len({entry['url'] for entry in entries}) == 21
          assert sum(entry['lastmod'] == '2026-11-03' for entry in entries) == 17
          assert sum(entry['lastmod'] is None for entry in entries) == 4
          summary = {'commit': os.environ['GITHUB_SHA'], 'passed': True, 'scope': 'Runner-local editorial fallback; no reachable DB or catalogue integration claim.', 'entries': entries}
          (output / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({'step': 'sitemap_xml', 'status': 'pass', 'editorialUrls': 21, 'verifiedLastmod': 17, 'omittedLastmod': 4}))
          PY
          docker stop rebond-seo-candidate
      - uses: actions/upload-artifact@v4
        if: always() && inputs.seo_audit
        with:
          name: rebondpro-seo-validation-${{ github.sha }}
          path: ${{ runner.temp }}/rebond-seo-validation
          retention-days: 7
      - uses: actions/checkout@v4
        if: inputs.performance_audit
        with:
          ref: b4f3086cbba1ba57ea31fe74c935bf20801c01c9
          path: _perf_baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.performance_audit
        with:
          node-version: '22'
      - name: Prepare isolated baseline and headless audit tools
        if: inputs.performance_audit
        run: |
          # Use the same parameterized packaging recipe for both app revisions.
          docker build --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" -f "$GITHUB_WORKSPACE/Dockerfile" -t rebondpro-app:perf-baseline ./_perf_baseline
          npm install --prefix "$RUNNER_TEMP/rebond-audit-tools" --no-audit --no-fund lighthouse@13.6.0 playwright@1.61.1
          "$RUNNER_TEMP/rebond-audit-tools/node_modules/.bin/playwright" install --with-deps chromium
          docker run -d --name rebond-candidate -p 3763:3000 -e DATABASE_URL=postgresql://unavailable:unavailable@127.0.0.1:1/unavailable -e AUTH_SECRET=isolated-ci-placeholder -e APP_PUBLIC_URL=https://lebonrebond.fr rebondpro-app:${GITHUB_SHA}
          docker run -d --name rebond-baseline -p 3764:3000 -e DATABASE_URL=postgresql://unavailable:unavailable@127.0.0.1:1/unavailable -e AUTH_SECRET=isolated-ci-placeholder -e APP_PUBLIC_URL=https://lebonrebond.fr rebondpro-app:perf-baseline
          for port in 3763 3764; do
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/" > /dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" > /dev/null
          done
          docker run --rm --network host rebondpro-builder:${GITHUB_SHA} npm run smoke:public-seo -- --base-url http://127.0.0.1:3763
      - name: Compare homepage visibility and mobile Lighthouse
        if: inputs.performance_audit
        env:
          PERFORMANCE_AUDIT_TOOLS: ${{ runner.temp }}/rebond-audit-tools
          PERFORMANCE_OUTPUT_DIR: ${{ runner.temp }}/rebond-home-performance
          PERFORMANCE_BASELINE_URL: http://127.0.0.1:3764
          PERFORMANCE_CANDIDATE_URL: http://127.0.0.1:3763
          PERFORMANCE_BASELINE_SHA: b4f3086cbba1ba57ea31fe74c935bf20801c01c9
        run: node scripts/audit-home-performance.mjs
      - uses: actions/upload-artifact@v4
        if: always() && inputs.performance_audit
        with:
          name: rebondpro-home-performance-${{ github.sha }}
          path: ${{ runner.temp }}/rebond-home-performance
          retention-days: 7
      - name: Export deployable image
        run: |
          docker save rebondpro-app:${GITHUB_SHA} | gzip -1 > rebondpro-app.tar.gz
          sha256sum rebondpro-app.tar.gz > rebondpro-app.sha256
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          archive = pathlib.Path('rebondpro-app.tar.gz')
          sha = os.environ['GITHUB_SHA']
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', f'rebondpro-app:{sha}']))[0]
          with tarfile.open(archive, 'r:gz') as saved:
              manifest = json.load(saved.extractfile('manifest.json'))[0]
              config = json.load(saved.extractfile(manifest['Config']))
              diff_ids = config['rootfs']['diff_ids']
              assert len(diff_ids) == len(manifest['Layers'])
              layers = [{'diffId': diff_id, 'archivePath': path, 'archiveBytes': saved.getmember(path).size} for diff_id, path in zip(diff_ids, manifest['Layers'])]
          digest = hashlib.sha256()
          with archive.open('rb') as source:
              for block in iter(lambda: source.read(1024 * 1024), b''):
                  digest.update(block)
          budget = {'commit': sha, 'imageId': image['Id'], 'tags': manifest['RepoTags'], 'nodeBaseImage': os.environ['NODE_BASE_IMAGE'], 'nodeBaseDigestInput': os.environ.get('NODE_BASE_DIGEST_INPUT', ''), 'gzipBytes': archive.stat().st_size, 'gzipSha256': digest.hexdigest(), 'dockerReportedSizeBytes': image['Size'], 'layerArchiveBytes': sum(layer['archiveBytes'] for layer in layers), 'layers': layers, 'scope': 'Measured CI image and saved layer members. VPS preflight must compare shared diffIds and allow for transfer, Docker loading and filesystem overhead; this is not deployment approval.'}
          pathlib.Path('rebondpro-image-budget.json').write_text(json.dumps(budget, indent=2) + '\n')
          print(json.dumps({key: value for key, value in budget.items() if key != 'layers'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rebondpro-image-budget-${{ github.sha }}
          path: rebondpro-image-budget.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: rebondpro-seo-image-${{ github.sha }}
          path: |
            rebondpro-app.tar.gz
            rebondpro-app.sha256
            rebondpro-image-budget.json
          compression-level: 0
          retention-days: 3

