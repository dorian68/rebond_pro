# RebondPro Formation — services de développement local
# (transposables en SaaS : Postgres managé, Redis managé, fournisseur email en prod)
services:
  db:
    image: postgres:16-alpine
    container_name: rebondpro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rebondpro
      POSTGRES_PASSWORD: rebondpro
      POSTGRES_DB: rebondpro
    ports:
      - "5432:5432"
    volumes:
      - rebondpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebondpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rebondpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rebondpro_redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: rebondpro-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI -> http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  rebondpro_pgdata:
  rebondpro_redisdata:
